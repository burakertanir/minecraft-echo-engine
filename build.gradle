plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id "com.diffplug.spotless" version "6.25.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.lavalink.dev/releases" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	mavenCentral()
}

// Loom include configuration bundles dependencies into the mod JAR
configurations {
	include
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// LavaPlayer — Internet audio streaming (YouTube, SoundCloud, HTTP)
	implementation("dev.arbjerg:lavaplayer:2.2.6")
	include("dev.arbjerg:lavaplayer:2.2.6")
	include("dev.arbjerg:lava-common:2.2.6")
	include("org.apache.httpcomponents:httpclient:4.5.14")
	include("org.apache.httpcomponents:httpcore:4.4.16")
	include("commons-logging:commons-logging:1.2")
	include("commons-codec:commons-codec:1.15")
	include("com.fasterxml.jackson.core:jackson-core:2.15.2")
	include("com.fasterxml.jackson.core:jackson-databind:2.15.2")
	include("com.fasterxml.jackson.core:jackson-annotations:2.15.2")

	// YouTube Source Plugin — Replaces deprecated built-in YouTube source
	implementation("dev.lavalink.youtube:v2:1.18.1")
	include("dev.lavalink.youtube:v2:1.18.1")
	include("dev.lavalink.youtube:common:1.18.1")
	include("com.grack:nanojson:1.7")

	// Lavaplayer Natives (Required for audio decoding, otherwise playback silently fails)
	implementation 'dev.arbjerg:lavaplayer-natives:2.2.6'
	include 'dev.arbjerg:lavaplayer-natives:2.2.6'

	// Rhino Script Engine (Required for Youtube plugin on Java 15+)
	implementation 'org.mozilla:rhino:1.7.14'
	include 'org.mozilla:rhino:1.7.14'
	implementation 'org.mozilla:rhino-engine:1.7.14'
	include 'org.mozilla:rhino-engine:1.7.14'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

loom {
    runs {
        client {
            programArgs "--username", "DevBurak"
        }
    }
}

// jemalloc native crash workaround: set env var + jvm args on runClient task
tasks.named('runClient') {
    environment "JEMALLOC_CONF", "background_thread:false,dirty_decay_ms:0,muzzy_decay_ms:0"
    jvmArgs "-Djdk.nio.maxCachedBufferSize=262144"
}
