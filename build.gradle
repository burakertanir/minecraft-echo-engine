plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id "com.diffplug.spotless" version "6.25.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.lavalink.dev/releases" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	mavenCentral()
}

sourceSets {
	gameTest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

// Loom include configuration bundles dependencies into the mod JAR
configurations {
	include
	lavaplayerUpstream {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
	gameTestImplementation.extendsFrom implementation, modImplementation
	gameTestRuntimeOnly.extendsFrom runtimeOnly, modRuntimeOnly
}

def lavaplayerVersion = "2.2.6"
def strippedLavaplayerEntries = [
	// Deprecated built-in YouTube implementation rejected by CurseForge.
	'com/sedmelluq/discord/lavaplayer/source/youtube/**',
	// Convenience bootstrap hard-references the removed built-in implementation.
	'com/sedmelluq/discord/lavaplayer/source/AudioSourceManagers.class',
	'fabric.mod.json',
	// Repacking invalidates any upstream archive signature metadata.
	'META-INF/*.SF',
	'META-INF/*.RSA',
	'META-INF/*.DSA'
]
def strippedLavaplayerJar = tasks.register('strippedLavaplayerJar', Jar) {
	archiveBaseName = 'lavaplayer'
	archiveVersion = lavaplayerVersion
	archiveClassifier = 'no-legacy-youtube'
	destinationDirectory = layout.buildDirectory.dir('stripped-libraries')
	inputs.property 'strippedLavaplayerEntries', strippedLavaplayerEntries

	from({ zipTree(configurations.lavaplayerUpstream.singleFile) })
	strippedLavaplayerEntries.each { exclude it }
	from('gradle/lavaplayer-stripped.fabric.mod.json') {
		rename { 'fabric.mod.json' }
		expand version: lavaplayerVersion
	}
}

def strippedLavaplayerFiles = files(strippedLavaplayerJar.flatMap { it.archiveFile })
strippedLavaplayerFiles.builtBy(strippedLavaplayerJar)

dependencies {
	def jacksonVersion = "2.18.9"
	def rhinoVersion = "1.7.15"

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// LavaPlayer — Internet audio streaming (YouTube, SoundCloud, HTTP)
	implementation("dev.arbjerg:lavaplayer:${lavaplayerVersion}")
	lavaplayerUpstream("dev.arbjerg:lavaplayer:${lavaplayerVersion}")
	include("dev.arbjerg:lava-common:${lavaplayerVersion}")
	include("org.apache.httpcomponents:httpclient:4.5.14")
	include("org.apache.httpcomponents:httpcore:4.4.16")
	include("commons-logging:commons-logging:1.2")
	include("commons-codec:commons-codec:1.15")
	implementation("com.fasterxml.jackson.core:jackson-core:${jacksonVersion}")
	implementation("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
	implementation("com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}")
	include("com.fasterxml.jackson.core:jackson-core:${jacksonVersion}")
	include("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
	include("com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}")

	// YouTube Source Plugin — Replaces deprecated built-in YouTube source
	implementation("dev.lavalink.youtube:v2:1.18.1")
	include("dev.lavalink.youtube:v2:1.18.1")
	include("dev.lavalink.youtube:common:1.18.1")
	include("com.grack:nanojson:1.7")

	// Lavaplayer Natives (Required for audio decoding, otherwise playback silently fails)
	implementation "dev.arbjerg:lavaplayer-natives:${lavaplayerVersion}"
	include "dev.arbjerg:lavaplayer-natives:${lavaplayerVersion}"

	// Rhino Script Engine (Required for Youtube plugin on Java 15+)
	implementation "org.mozilla:rhino:${rhinoVersion}"
	include "org.mozilla:rhino:${rhinoVersion}"
	implementation "org.mozilla:rhino-engine:${rhinoVersion}"
	include "org.mozilla:rhino-engine:${rhinoVersion}"

	// Fast unit tests for pure audio, clustering, and acoustic calculations.
	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.compilerArgs.add('-Xlint:deprecation')
}

def unitTestWorkingDirectory = layout.buildDirectory.dir('test-run')
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	doFirst {
		def directory = unitTestWorkingDirectory.get().asFile
		directory.mkdirs()
		workingDir = directory
	}
}

// Gradle 8.6's Windows test worker can corrupt non-ASCII project paths in its
// generated classpath argument file. A manifest classpath keeps those paths
// URL-encoded while leaving normal project paths untouched.
def needsTestClasspathJar = System.getProperty('os.name').toLowerCase().contains('windows') &&
	!rootDir.absolutePath.matches('\\p{ASCII}*')
if (needsTestClasspathJar) {
	def testClasspathJar = tasks.register('testClasspathJar', Jar) {
		dependsOn tasks.named('testClasses')
		destinationDirectory = new File(gradle.gradleUserHomeDir, 'caches/audiophilecraft-test-pathing')
		archiveFileName = "${rootProject.name}-test-classpath.jar"
		outputs.upToDateWhen { false }
		doFirst {
			manifest.attributes('Class-Path': sourceSets.test.runtimeClasspath.files
				.collect { it.toURI().toASCIIString() }
				.join(' '))
		}
	}

	tasks.withType(Test).configureEach {
		dependsOn testClasspathJar
		doFirst {
			classpath = files(testClasspathJar.get().archiveFile.get().asFile)
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	from("THIRD_PARTY_NOTICES") {
		into "META-INF"
		rename { "THIRD_PARTY_NOTICES_${project.base.archivesName.get()}" }
	}
	from("third-party-licenses") {
		into "META-INF/licenses/${project.base.archivesName.get()}"
	}
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

loom {
	createRemapConfigurations(sourceSets.gameTest)
	mods {
		"audiophilecraft" {
			sourceSet sourceSets.main
		}
		"audiophilecraft-gametest" {
			sourceSet sourceSets.gameTest
		}
	}
    runs {
        client {
            programArgs "--username", "testkullanici"
        }
		gameTest {
			server()
			name "AudiophileCraft Game Test"
			source sourceSets.main
			runDir "build/game-test-run"
			property "fabric-api.gametest"
			property "fabric-api.gametest.report-file", file("build/test-results/gameTest/results.xml").absolutePath
			programArg "--nogui"
			ideConfigGenerated false
		}
    }
}

def prepareGameTestRun = tasks.register('prepareGameTestRun', Copy) {
	from('src/gameTest/server-config')
	into(layout.buildDirectory.dir('game-test-run'))
}

tasks.named('runGameTest') {
	dependsOn tasks.named('gameTestClasses'), prepareGameTestRun
	classpath sourceSets.gameTest.output
	outputs.file layout.buildDirectory.file('test-results/gameTest/results.xml')
}

def verifyCurseForgeCompatibility = tasks.register('verifyCurseForgeCompatibility') {
	dependsOn tasks.named('remapJar')
	inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })

	doLast {
		def outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
		def legacyYoutubePrefix = 'com/sedmelluq/discord/lavaplayer/source/youtube/'
		def legacySourceBootstrap = 'com/sedmelluq/discord/lavaplayer/source/AudioSourceManagers.class'
		def lavaplayerCoreClass = 'com/sedmelluq/discord/lavaplayer/player/DefaultAudioPlayerManager.class'
		def replacementYoutubeClass = 'dev/lavalink/youtube/YoutubeAudioSourceManager.class'
		def legacyEntries = []
		def nestedJarReferences = []
		def lavaplayerCoreContainer = null
		def lavaplayerCoreFound = false
		def replacementFound = false

		new java.util.zip.ZipFile(outputJar).withCloseable { outerJar ->
			def modMetadataEntry = outerJar.getEntry('fabric.mod.json')
			if (modMetadataEntry == null) {
				throw new GradleException("fabric.mod.json is missing from ${outputJar.name}")
			}
			def modMetadata = outerJar.getInputStream(modMetadataEntry).withCloseable {
				new groovy.json.JsonSlurper().parse(it)
			}
			nestedJarReferences.addAll((modMetadata.jars ?: []).collect { it.file })

			outerJar.entries().each { outerEntry ->
				if (outerEntry.name.startsWith(legacyYoutubePrefix) || outerEntry.name == legacySourceBootstrap) {
					legacyEntries.add(outerEntry.name)
				}
				if (outerEntry.name == replacementYoutubeClass) {
					replacementFound = true
				}
				if (outerEntry.name == lavaplayerCoreClass) {
					lavaplayerCoreFound = true
					lavaplayerCoreContainer = '<root>'
				}
				if (!outerEntry.directory && outerEntry.name.endsWith('.jar')) {
					def nestedBytes = outerJar.getInputStream(outerEntry).withCloseable { it.bytes }
					new java.util.zip.ZipInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nestedJar ->
						java.util.zip.ZipEntry nestedEntry
						while ((nestedEntry = nestedJar.nextEntry) != null) {
							if (nestedEntry.name.startsWith(legacyYoutubePrefix) ||
								nestedEntry.name == legacySourceBootstrap) {
								legacyEntries.add("${outerEntry.name}!/${nestedEntry.name}")
							}
							if (nestedEntry.name == replacementYoutubeClass) {
								replacementFound = true
							}
							if (nestedEntry.name == lavaplayerCoreClass) {
								lavaplayerCoreFound = true
								lavaplayerCoreContainer = outerEntry.name
							}
						}
					}
				}
			}
		}

		if (!legacyEntries.isEmpty()) {
			throw new GradleException(
				"CurseForge-incompatible legacy Lavaplayer YouTube classes found:\n" +
				legacyEntries.join('\n'))
		}
		if (!lavaplayerCoreFound) {
			throw new GradleException(
				"The stripped Lavaplayer core is missing from ${outputJar.name}")
		}
		if (lavaplayerCoreContainer != '<root>' && !nestedJarReferences.contains(lavaplayerCoreContainer)) {
			throw new GradleException(
				"fabric.mod.json does not load nested Lavaplayer JAR ${lavaplayerCoreContainer}")
		}
		if (!replacementFound) {
			throw new GradleException(
				"The supported youtube-source manager is missing from ${outputJar.name}")
		}
	}
}

tasks.named('remapJar') {
	dependsOn strippedLavaplayerJar
	nestedJars.from(strippedLavaplayerFiles)
	addNestedDependencies = true
}

tasks.named('check') {
	dependsOn tasks.named('runGameTest'), verifyCurseForgeCompatibility
}

// jemalloc native crash workaround: set env var + jvm args on runClient task
tasks.named('runClient') {
    environment "JEMALLOC_CONF", "background_thread:false,dirty_decay_ms:0,muzzy_decay_ms:0"
    jvmArgs "-Djdk.nio.maxCachedBufferSize=262144"
}
