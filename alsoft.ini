[general]
# AudiophileCraft: Raised source limit for large PA speaker clusters (4+ clusters).
# Default OpenAL Soft limit (~32) causes outermost clusters to be silently skipped
# because alGenSources() fails once the pool is exhausted.
# 256 sources is enough for 80+ speakers of 3 types each.
sources = 256

[hrtf]
enable = true
